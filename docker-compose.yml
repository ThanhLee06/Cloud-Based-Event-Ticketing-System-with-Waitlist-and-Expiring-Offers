services:
  postgres:
    image: postgres:16-alpine
    container_name: eventflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-eventflow}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - eventflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-eventflow} -d $${POSTGRES_DB:-eventflow}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eventflow_pgdata:
